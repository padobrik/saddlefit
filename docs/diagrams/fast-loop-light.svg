<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 892" role="img" aria-label="A failed check triggers local probes; changes stay on probation" font-size="13"><style>svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
