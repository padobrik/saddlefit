-text-primary)">Answer and a journal note</text><text x="560" y="620" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">the change stays on probation</text></g><g><rect x="80" y="684" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="708" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Return the best attempt</text><text x="230" y="724" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">flagged as failed</text></g><g><rect x="440" y="788" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="560" y="812" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Journal</text><text x="560" y="828" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">into the nightly batch</text></g><text x="375" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text x="242" y="286" font-size="11.5" style="fill:var(--cds-text-secondary)">no</text><text x="375" y="600" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text x="242" y="670" font-size="11.5" style="fill:var(--cds-text-secondary)">no</text><text x="335" y="808" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">logged</text><text x="568" y="716" font-size="11.5" style="fill:var(--cds-text-secondary)">logged with evidence</text></svg>
