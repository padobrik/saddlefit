<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 932" role="img" aria-label="Every new playbook must beat the old one before the tutor uses it" font-size="13"><style>svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
