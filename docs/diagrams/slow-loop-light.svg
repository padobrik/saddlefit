ont-weight="600" style="fill:var(--cds-text-primary)">Statistics</text><text x="230" y="220" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">acceptance by change type, model, task type</text></g><g><rect x="80" y="268" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="292" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">New playbook version</text><text x="230" y="308" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">techniques ranked by success</text></g><g><rect x="80" y="356" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="380" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">A/B on the same batches</text><text x="230" y="396" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">middle loop with the old vs new playbook</text></g><g><polygon points="150,480 230,440 310,480 230,520" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="484" text-anchor="middle" style="fill:var(--cds-text-primary)">New one better?</text></g><g><rect x="440" y="452" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="560" y="476" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Keep the old playbook</text><text x="560" y="492" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">and record why</text></g><g><rect x="80" y="548" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="572" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Adopt the playbook</text><text x="230" y="588" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">the tutor tries its top techniques first</text></g><g><rect x="80" y="636" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="660" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Shadow tutor</text><text x="230" y="676" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">a compact model proposes alongside</text></g><g><polygon points="150,760 230,720 310,760 230,800" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="230" y="764" text-anchor="middle" style="fill:var(--cds-text-primary)">As good as cloud?</text></g><g><rect x="440" y="732" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="560" y="756" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Keep the cloud tutor</text><text x="560" y="772" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">more data, then retry</text></g><g><rect x="80" y="828" width="300" height="56" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text x="230" y="852" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Switch to the local tutor</text><text x="230" y="868" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">the whole loop runs on one machine</text></g><text x="242" y="538" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text x="375" y="472" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">no</text><text x="704" y="300" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">next cycle</text><text x="242" y="818" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text x="375" y="752" text-anchor="