  --cds-chart-reference-tint: rgba(68, 147, 248, 0.1); }</style><defs><marker id="src-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Middle loop from AutoSaddler; fast loop and recursion from Harness²</text><g><rect x="24" y="56" width="340" height="168" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="40" y="82" font-weight="600" style="fill:var(--cds-text-primary)">AutoSaddler · middle loop</text><text x="40" y="110" style="fill:var(--cds-text-primary)">learning ahead of time on task batches</text><text x="40" y="132" style="fill:var(--cds-text-primary)">diagnose failures → change → check</text><text x="40" y="154" style="fill:var(--cds-text-primary)">checks on a held-out set</text><text x="40" y="176" style="fill:var(--cds-text-primary)">mechanics first, then text</text><text x="40" y="198" style="fill:var(--cds-text-primary)">evaluator hidden from the optimizer</text></g><g><rect x="396" y="56" width="340" height="168" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text x="412" y="82" font-weight="600" style="fill:var(--cds-text-primary)">Harness² · loops and breadth</text><text x="412" y="110" style="fill:var(--cds-text-primary)">8 harness parts, from prompt to plugins</text><text x="412" y="132" style="fill:var(--cds-text-primary)">EXPERIENCE.md — a library of lessons</text><text x="412" y="154" style="fill:var(--cds-text-primary)">no evidence, no lesson</text><text x="412" y="176" style="fill:var(--cds-text-primary)">Propose → Probe → Compose during a task</text><text x="412" y="198" style="fill:var(--cds-text-primary)">recursion: the improver improves too</text></g><g fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M194 224V264" marker-end="url(#src-arrow)"/><path d="M566 224V264" marker-end="url(#src-arrow)"/></g><text x="202" y="250" font-size="11.5" style="fill:var(--cds-text-secondary)">process</text><text x="574" y="250" font-size="11.5" style="fill:var(--cds-text-secondary)">loops and breadth</text><g><rect x="24" y="264" width="712" height="186" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text x="40" y="292" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Saddlefit</text><text x="40" y="314" style="fill:var(--cds-text-secondary)">and what it adds:</text><text x="40" y="340" style="fill:var(--cds-text-primary)">a compact student; the tutor starts in the cloud and moves local</text><text x="40" y="362" style="fill:var(--cds-text-primary)">runs on macOS, Linux and Windows; sandbox without network by default</text><text x="40" y="384" style="fill:var(--cds-text-primary)">output: a fitted harness, a report and portable SKILL.md files</text><text x="40" y="406" style="fill:var(--cds-text-primary)">the repository improves itself through evidence-gated pull requests</text><text x="40" y="428" font-weight="600" style="fill:var(--cds-text-primary)">core rule: think little, test much — and nothing extra in the context</text></g></svg>
