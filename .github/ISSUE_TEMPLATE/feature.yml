name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Saddlefit do? Mention the spec section if it applies.
    validations:
      required: true
  - type: textarea
    id: integrity
    attributes:
      label: Evaluation-integrity impact
      description: Could this let any model see sealed data, held-out or control outcomes?
