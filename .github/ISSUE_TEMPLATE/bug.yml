name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands, config and task layout.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Saddlefit version
      description: Output of `saddlefit --version`.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Docker version, model runner and model (`saddlefit doctor --json` helps).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove keys and private code first.
      render: text
