name: publish

on:
  release:
    types: [published]
  # release-please creates the Release with the Actions token, and events from that token
  # start no workflow, so it dispatches this one; it also allows publishing a tag again
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Only a tag with a published GitHub Release may be shipped, whichever way this started.
  release-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::$TAG has no published release"
            exit 1
          fi
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

  pypi:
    needs: release-tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saddlefit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PyPI never replaces a file; a repeated dispatch skips what is already there
          skip-existing: true

  sandbox-image:
    needs: release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-tag.outputs.ref }}
          persist-credentials: false
      # arm64 too, for Apple Silicon and ARM Linux hosts; QEMU emulates it on this runner
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/saddlefit-sandbox
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "sandbox image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
