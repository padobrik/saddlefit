name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|ci|chore|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "expected e.g. 'feat(loops): add ablation'"
            exit 1
          fi
