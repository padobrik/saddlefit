name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      SADDLEFIT_LIVE_MODEL: qwen3:0.6b
      SADDLEFIT_LIVE_BASE_URL: http://localhost:11434/v1
    services:
      ollama:
        image: ollama/ollama:0.40.6
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Pull a tiny model
        run: |
          jq -n --arg model "$SADDLEFIT_LIVE_MODEL" '{model: $model, stream: false}' \
            | curl -fsS http://localhost:11434/api/pull -d @-
      - name: Live smoke tests
        run: uv run pytest -m live
