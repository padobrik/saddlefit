[project]
name = "saddlefit"
version = "0.1.2"
description = "A self-improving harness that fits itself to your compact local model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "padobrik" }]
keywords = ["llm", "agents", "local-llm", "compact-models", "ollama", "harness"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.15",
    "docker>=7.1",
    "openai>=3.35",
    "pydantic>=2.11",
    "python-ulid>=3.0",
    "pyyaml>=6.0.2",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/padobrik/saddlefit"
Issues = "https://github.com/padobrik/saddlefit/issues"
Changelog = "https://github.com/padobrik/saddlefit/blob/main/CHANGELOG.md"

[project.scripts]
saddlefit = "saddlefit.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "jsonschema>=4.23",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-socket>=0.7",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saddlefit"]

[tool.hatch.build.targets.sdist]
include = ["src/saddlefit", "schemas", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["tests/fixtures/toyrepo"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607", "PLR0915"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["saddlefit"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "saddlefit.eval.*",
    "saddlefit.harness.*",
    "saddlefit.loops.*",
    "saddlefit.tasks.*",
    "saddlefit.storage.*",
]
strict = true

[[tool.mypy.overrides]]
# the Docker SDK ships no type information
module = ["docker"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tests/fixtures"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-socket",
    "--allow-unix-socket",
    "-m",
    "not live",
]
markers = [
    "integration: loops end to end with the fake provider and the toy repository",
    "docker: needs a Docker daemon (Linux CI)",
    "live: needs a local model runner; nightly only, network allowed",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["saddlefit"]
omit = [
    "*/saddlefit/providers/anthropic.py",
    "*/saddlefit/providers/looped.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
