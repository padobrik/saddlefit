# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true      # approve only when comments are resolved and checks pass
  allow_author_approval: false        # the PR author cannot self-approve or bulk-resolve
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!uv.lock"
    - "!schemas/**"
    - "!tests/fixtures/toyrepo/**"
  path_instructions:
    - path: "src/saddlefit/eval/**"
      instructions: |
        Evaluation-integrity boundary. Flag any path that lets the student model (its
        prompts, tool results, run records or reports), the tutor, the generator or the fast
        loop read sealed data (hidden tests, check.sh, reference solutions, hidden-check
        output) or held-out and control outcomes. Control results must never feed a decision.
        Code under test reading the hidden tests inside the evaluation container is the B10
        design, not a leak, as long as check output goes only to the sealed store and only
        the verdict's flags and numbers (passed, exit code, duration, timed out, tampered,
        diff applied, environment error) leave evaluation, never hidden-test content, paths
        or check output. Reports may carry
        held-out aggregates, and control outcomes only after report --final (ADR 0003).
    - path: "src/saddlefit/sandbox/**"
      instructions: |
        Flag anything that enables network access, mounts host paths beyond the run workspace,
        passes environment variables beyond the allowlist, runs as root, or removes CPU,
        memory, pids or time limits.
    - path: "src/saddlefit/harness/**"
      instructions: |
        Proposals may touch only allowlisted harness paths. Check patch validation, size
        limits and schema validation of loop.yaml.
    - path: "src/saddlefit/providers/**"
      instructions: |
        Check timeouts, retries with backoff for transient errors only, usage accounting,
        and that no API key can reach logs, prompts or the sandbox.
    - path: "src/saddlefit/storage/**"
      instructions: |
        A change to a released persisted format (one a vX.Y.Z tag contains) must bump
        schema_version and ship a migration with tests. Unreleased formats keep their
        version and need no migration (ADR 0002).
    - path: "tests/**"
      instructions: |
        Tests must be deterministic and must not use the network unless marked live.
    - path: ".github/workflows/**"
      instructions: |
        Least-privilege permissions, actions pinned to commit SHAs, no secrets in workflows
        triggered by pull_request.
  pre_merge_checks:
    title:
      mode: error
      requirements: "Conventional Commits format, for example 'feat(loops): add ablation'."
    description:
      mode: warning
    custom_checks:
      - name: "Evaluation integrity"
        mode: error
        instructions: |
          Fail if the change lets the student model (its prompts, tool results, run records
          or reports), the tutor, the generator or the fast loop read sealed task data or
          held-out or control outcomes, or lets control results influence any decision. Code
          under test reading the hidden tests inside the evaluation container, as B10
          mechanism 2 prescribes, is not such a read, provided the check's output goes only
          to the sealed store and nothing but the verdict (passed, exit code, duration,
          timed out, tampered, diff applied, environment error) reaches the student model,
          the tutor, the generator or the fast loop; the verdict never carries hidden-test
          content, hidden-test paths or check output. Reports
          may carry what B10 allows them: held-out aggregates, and control outcomes only
          after report --final (ADR 0003).
          Pass otherwise.
      - name: "Schema versioning"
        mode: error
        instructions: |
          Every persisted format must carry an integer schema_version, and a new format
          must start at schema_version 1; fail if a new one does not. Fail if a released
          persisted format (its model, serializer or file layout) changes without a
          schema_version bump, a migration and a test. A format is released once a vX.Y.Z
          tag contains it. A change to a format no release has shipped yet needs no bump
          or migration, because no reader of an earlier version can exist. A new default
          for an optional field is not a format change when the serializer writes that
          field out, so files already written keep their value; nor is removing a JSON
          Schema `default` annotation. Pass otherwise.
  tools:
    ruff:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    hadolint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    skillspector:
      enabled: true
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: local
